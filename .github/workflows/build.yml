name: build-and-test

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cross-compile the Windows tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc -O2 -mwindows -o st33tpmtool.exe src/st33tpmtool.c
          file st33tpmtool.exe

      - name: Upload the .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: st33tpmtool.exe
          path: st33tpmtool.exe

  test-under-wine:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Cross-compile (same flags as CI artifact)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 file
          x86_64-w64-mingw32-gcc -O2 -mwindows -o st33tpmtool.exe src/st33tpmtool.c

      - name: Install Wine + pytest
        run: |
          sudo apt-get install -y -qq wine64 xvfb
          python -m pip install --upgrade pip pytest

      - name: Initialise the Wine prefix
        run: |
          export WINEPREFIX=$HOME/.wine-test WINEDEBUG=-all
          timeout 120 wineboot -i || true
          wine clock || echo "wineboot done"

      - name: Run the integration test-suite (simulator)
        run: |
          export WINEPREFIX=$HOME/.wine-test WINEDEBUG=-all XDG_RUNTIME_DIR=/tmp
          python -m pytest tests -v -q
